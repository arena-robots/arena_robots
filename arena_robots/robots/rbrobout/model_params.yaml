robot_model: rbrobout
base_frame: robot_base_footprint
z_offset: 0.0
mass:
  base_kg: 226.0
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: robot_front_laser_link
    sensor: front_laser
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: robot_front_laser_link
    sensor: front_laser
  - name: lidar_rear
    type: laserscan
    topic: ${namespace}/lidar/rear
    frame: robot_rear_laser_link
    sensor: rear_laser
  - name: lidar_rear_points
    type: pointcloud
    topic: ${namespace}/lidar/rear/points
    frame: robot_rear_laser_link
    sensor: rear_laser
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: robot_vectornav_link
    sensor: imu_sensor
control:
  mode: ros2_control
  config: package://arena_robots/robots/rbrobout/control.yaml
  controllers:
    - joint_state_broadcaster
    - rbrobout_velocity_controller
  cmd_vel_topic: rbrobout_velocity_controller/reference
  odom_topic: rbrobout_velocity_controller/odometry
