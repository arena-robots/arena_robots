robot_model: rbkairos
base_frame: robot_base_footprint
z_offset: 0.0
mass:
  base_kg: 151.0
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: robot_front_laser_link
    sensor: front_laser
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: robot_front_laser_link
    sensor: front_laser
  - name: lidar_rear
    type: laserscan
    topic: ${namespace}/lidar/rear
    frame: robot_rear_laser_link
    sensor: rear_laser
  - name: lidar_rear_points
    type: pointcloud
    topic: ${namespace}/lidar/rear/points
    frame: robot_rear_laser_link
    sensor: rear_laser
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: robot_vectornav_link
    sensor: imu_sensor
  - name: rgbd_camera_image
    type: image
    topic: ${namespace}/rgbd_camera/image
    frame: robot_front_rgbd_camera_color_frame
    sensor: front_camera_color
  - name: rgbd_camera_info
    type: camera_info
    topic: ${namespace}/rgbd_camera/camera_info
    frame: robot_front_rgbd_camera_color_frame
    sensor: front_camera_color
control:
  mode: ros2_control
  config: package://arena_robots/robots/rbkairos/control.yaml
  controllers:
    - joint_state_broadcaster
    - rbkairos_velocity_controller
  cmd_vel_topic: rbkairos_velocity_controller/reference
  odom_topic: rbkairos_velocity_controller/odometry
