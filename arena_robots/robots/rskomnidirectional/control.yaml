controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    rskomni_velocity_controller:
      type: arena_omni_drive_controller/OmniDriveController

rskomni_velocity_controller:
  ros__parameters:
    use_sim_time: true
    # 3-wheel omni at 120 deg spacing, wheel joints defined in rskomnidirectional.urdf.xacro
    wheel_joint_names: [wheel1_speed, wheel2_speed, wheel3_speed]

    # Wheel contact positions: URDF joint origins plus the 0.01 m collision offset along the axle
    wheel_positions_x: [ 0.0286,  0.0286, -0.0572]
    wheel_positions_y: [ 0.0495, -0.0495,  0.0000]

    # Rolling-axis angle in body frame (rad). theta_i = (body angle of wheel) + pi/2 for
    # kiwi-drive rolling tangent to radial. If observed motion is inverted, switch
    # direction to 'cw' below instead of negating all entries here.
    wheel_angles:      [2.6180, 0.5236, 4.7124]
    direction:         ccw

    # Effective rolling radius (m), pin_bearing_oring offset + roller radius. Estimate;
    # calibrate against measured odom drift.
    wheel_radius:      0.0345

    cmd_vel_timeout:   0.5
    use_stamped_vel:   true
    publish_odom:      true
    publish_tf:        false
    odom_frame_id:     odom
    base_frame_id:     base
    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001,     1000000.0, 1000000.0, 0.03]
