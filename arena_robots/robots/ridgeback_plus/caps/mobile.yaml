odom_frame: odom
sensor_frame: lidar
radius: 0.4
is_holonomic: false

footprint: [[0.48, -0.40], [0.48, 0.40], [-0.48, 0.40], [-0.48, -0.40]]

polygons_dict:
  StopPolygon:
    type: polygon
    points: [[0.48, 0.40], [0.48, -0.40], [-0.48, -0.40], [-0.48, 0.40]]
    action_type: stop
    min_points: 4
    visualize: true
    polygon_pub_topic: polygon_stop
    enabled: true

footprint_padding: 0.1

actions:
  continuous:
    linear:
      min: -2.0
      max: 2.0
    angular:
      min: -4.0
      max: 4.0
  discrete:
    - angular: 0.0
      linear: 0.3
      name: move_forward
    - angular: 0.0
      linear: -0.15
      name: move_backward
    - angular: 0.35
      linear: 0.15
      name: turn_left
    - angular: -0.35
      linear: 0.15
      name: turn_right
    - angular: 0.75
      linear: 0.0
      name: turn_strong_left
    - angular: -0.75
      linear: 0.0
      name: turn_strong_right
    - angular: 0.0
      linear: 0.0
      name: stop

laser:
  angle:
    increment: 0.00654497222
    max: 2.35619
    min: -2.35619
  num_beams: 720
  range: 30.0
  update_rate: 10

nav2:
  planner_plugins:
    - GridBased
  planner_plugins_dict:
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
