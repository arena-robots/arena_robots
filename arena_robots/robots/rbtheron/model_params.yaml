robot_model: rbtheron
base_frame: robot_base_footprint
z_offset: 0.0
mass:
  base_kg: 54.0
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/scan
    frame: robot_front_laser_link
    sensor: front_laser
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/scan/points
    frame: robot_front_laser_link
    sensor: front_laser
  - name: lidar_rear
    type: laserscan
    topic: ${namespace}/scan/rear
    frame: robot_rear_laser_link
    sensor: rear_laser
  - name: lidar_rear_points
    type: pointcloud
    topic: ${namespace}/scan/rear/points
    frame: robot_rear_laser_link
    sensor: rear_laser
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: robot_vectornav_link
    sensor: imu_sensor
  - name: front_camera_image
    type: image
    topic: ${namespace}/front_camera/image
    frame: robot_front_rgbd_camera_color_frame
    sensor: front_camera_color
  - name: front_camera_info
    type: camera_info
    topic: ${namespace}/front_camera/camera_info
    frame: robot_front_rgbd_camera_color_frame
    sensor: front_camera_color
  - name: rear_camera_image
    type: image
    topic: ${namespace}/rear_camera/image
    frame: robot_rear_rgbd_camera_color_frame
    sensor: rear_camera_color
  - name: rear_camera_info
    type: camera_info
    topic: ${namespace}/rear_camera/camera_info
    frame: robot_rear_rgbd_camera_color_frame
    sensor: rear_camera_color
control:
  mode: ros2_control
  config: package://arena_robots/robots/rbtheron/control.yaml
  controllers:
    - joint_state_broadcaster
    - rbtheron_velocity_controller
  cmd_vel_topic: rbtheron_velocity_controller/cmd_vel
  odom_topic: rbtheron_velocity_controller/odom
