robot_model: rbvogui_plus
base_frame: robot_base_footprint
z_offset: 0.0
mass:
  base_kg: 122.45
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/scan
    frame: robot_front_laser_link
    sensor: front_laser
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/scan/points
    frame: robot_front_laser_link
    sensor: front_laser
  - name: lidar_rear
    type: laserscan
    topic: ${namespace}/scan/rear
    frame: robot_rear_laser_link
    sensor: rear_laser
  - name: lidar_rear_points
    type: pointcloud
    topic: ${namespace}/scan/rear/points
    frame: robot_rear_laser_link
    sensor: rear_laser
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: robot_vectornav_link
    sensor: imu_sensor
  - name: front_rgbd_camera_image
    type: image
    topic: ${namespace}/front_rgbd_camera/color/image_raw
    frame: robot_front_rgbd_camera_color_frame
    sensor: front_camera_color
  - name: front_rgbd_camera_info
    type: camera_info
    topic: ${namespace}/front_rgbd_camera/color/camera_info
    frame: robot_front_rgbd_camera_color_frame
    sensor: front_camera_color
  - name: rear_rgbd_camera_image
    type: image
    topic: ${namespace}/rear_rgbd_camera/color/image_raw
    frame: robot_rear_rgbd_camera_color_frame
    sensor: rear_camera_color
  - name: rear_rgbd_camera_info
    type: camera_info
    topic: ${namespace}/rear_rgbd_camera/color/camera_info
    frame: robot_rear_rgbd_camera_color_frame
    sensor: rear_camera_color
control:
  mode: ros2_control
  config: package://arena_robots/robots/rbvogui_plus/control.yaml
  controllers:
    - joint_state_broadcaster
    - robotnik_base_controller
    - arm_controller
  cmd_vel_topic: robotnik_base_controller/cmd_vel
  odom_topic: robotnik_base_controller/odometry
