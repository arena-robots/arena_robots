# vln_rgb (the planner's own camera, unchanged) + a 640x480 / 30 Hz RGB camera with the same optics and a
# third-person chase camera, for episode videos of the RGB-only VLN planners. The adapter binds
# `sensor: image` to the FIRST image sensor, the planner's camera, listed first below.
# Use: robot:='jackal[camera=vln_navid_rec]' (navid), vln_uninavid_rec, vln_navila_rec, vln_streamvln_rec.
# Recording topics: <ns>/vln_camera/rec_image, <ns>/vln_camera/chase_image
variants: [vln_navid_rec, vln_uninavid_rec, vln_streamvln_rec, vln_navila_rec]

xacro:
  include: "$(find arena_robots)/components/camera/vln_rgb_rec/vln_rgb_rec.urdf.xacro"
  macro: vln_rgb_rec
  attach:
    name: "${prefix}${mount}"
    parent_link: "${prefix}${parent}"
    sensor: "${mount}"
    topic: "${topic:-vln_camera}"
    height: "${height:-0.9815}"
    optics_file: "$(find arena_robots)/components/camera/vln_rgb_rec/optics/${variant}.yaml"
  args:
    height: 0.9815
sensor:
  gz:
    - name: "${name:-vln_camera}_image"
      type: image
      topic: "${topic:-vln_camera}/image"
      frame: "${prefix}${mount}_rgb_camera_frame"
      sensor: "${mount}_rgb_camera"
    - name: "${name:-vln_camera}_info"
      type: camera_info
      topic: "${topic:-vln_camera}/camera_info"
      frame: "${prefix}${mount}_rgb_camera_frame"
      sensor: "${mount}_rgb_camera"
    - name: "${name:-vln_camera}_rec_image"
      type: image
      topic: "${topic:-vln_camera}/rec_image"
      frame: "${prefix}${mount}_rgb_camera_frame"
      sensor: "${mount}_rec_camera"
    - name: "${name:-vln_camera}_chase_image"
      type: image
      topic: "${topic:-vln_camera}/chase_image"
      frame: "${prefix}${mount}_chase_camera_frame"
      sensor: "${mount}_chase_camera"
power:
  static_power_w: 2.0
